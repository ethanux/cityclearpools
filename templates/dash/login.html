<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authorized Access</title>
  <style>
    /* --- General Reset --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Courier New", monospace;
    }

    /* --- Body Styling --- */
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #0d0d0d, #000);
      color: #00ff9f;
    }

    /* --- Container --- */
    .container {
      text-align: center;
      padding: 40px;
      border: 1px solid #00ff9f33;
      border-radius: 12px;
      background: rgba(15, 15, 15, 0.85);
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 25px #00ff9f22;
    }

    /* --- Title --- */
    .title {
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #00ff9f;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    /* --- Input Field --- */
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #00ff9f66;
      border-radius: 6px;
      background: #0a0a0a;
      color: #00ff9f;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="password"]:focus {
      border-color: #00ff9f;
      box-shadow: 0 0 10px #00ff9f55;
    }

    /* --- Submit Button --- */
    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: #00ff9f;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: #00d88a;
      transform: scale(1.02);
    }

    /* --- Responsive --- */
    @media (max-width: 500px) {
      .container {
        padding: 25px;
      }
      .title {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title"># AUTHORIZED ACCESS ONLY #</div>
    <form method="post">
      <input type="password" name="password" placeholder="Enter password" required />
      <button type="submit">Enter</button>
    </form>
  </div>
</body>
</html>
